[workspace]
resolver = "3"
members = ["nebula-connector-sdk", "nebula-connectors"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.98"
license = "Apache-2.0"
repository = "https://github.com/zeroset-inc/nebula-connectors"

[workspace.dependencies]
nebula-connector-sdk = { path = "nebula-connector-sdk", version = "=0.1.0" }
axum = { version = "=0.8.9", default-features = false, features = ["http1", "json", "tokio"] }
base64 = "=0.22.1"
hmac = "=0.12.1"
jsonwebtoken = { version = "=11.1.0", default-features = false, features = ["aws_lc_rs"] }
zeroize = "=1.9.1"
async-trait = "=0.1.92"
jsonschema = { version = "=0.33.0", default-features = false }
reqwest = { version = "=0.13.4", default-features = false, features = ["json", "rustls", "stream"] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = { version = "=1.0.151", features = ["arbitrary_precision", "raw_value"] }
sha2 = "=0.10.9"
thiserror = "=2.0.20"
tokio = { version = "=1.53.1", features = ["fs", "io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
typify = "=0.8.0"
uuid = { version = "=1.28.0", features = ["v4"] }
