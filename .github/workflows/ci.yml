name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.arch }})
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: linux-x86_64
          - runner: ubuntu-24.04-arm
            arch: linux-aarch64
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Install pinned tools
        run: |
          rustup toolchain install "$(python3 -c 'import tomllib; print(tomllib.load(open("rust-toolchain.toml", "rb"))["toolchain"]["channel"])')" --profile minimal --component rustfmt --component clippy
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -r requirements-ci.txt
      - name: Check dependencies and wire fixtures
        run: |
          python3 check.py
          .venv/bin/python -m unittest discover -s nebula-connector-sdk/tests -v
      - name: Check Rust
        run: |
          cargo fmt --all --check
          cargo clippy --locked --workspace --all-targets -- -D warnings
          cargo test --locked --workspace
      - name: Build release binaries
        if: startsWith(github.ref, 'refs/tags/v')
        env:
          ARCH: ${{ matrix.arch }}
        run: |
          cargo build --locked --release --bins
          mkdir dist
          tar -czf "dist/nebula-connectors-${ARCH}.tar.gz" -C target/release nebula-connector nebula-connector-control -C "$GITHUB_WORKSPACE" LICENSE
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: startsWith(github.ref, 'refs/tags/v')
        with:
          name: binaries-${{ matrix.arch }}
          path: dist/*.tar.gz
          if-no-files-found: error
          retention-days: 7
